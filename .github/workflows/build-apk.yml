name: Gerar APK Beit Tefila Yeshua

on:
  workflow_dispatch:
  push:
    branches:
      - principal
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair projeto Android
        run: |
          unzip -o beit-tefila-yeshua-project.zip -d projeto

      - name: Compilar APK
        working-directory: projeto/beit_tefila_yeshua_android
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Beit-Tefila-Yeshua-APK
          path: projeto/beit_tefila_yeshua_android/app/build/outputs/apk/debug/*.apk
